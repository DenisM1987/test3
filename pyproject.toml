[project]
name = "testgit"
version = "0.1.0"
description = ""
authors = [
    {name = "Denis M",email = "mden1987@inbox.ru"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "transaction-analyzer"
version = "0.1.0"
description = "Анализатор банковских транзакций"

[tool.black]
line-length = 119
exclude = '''
/(
    .git
)
'''

[tool.isort]
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = ["venv"]