[tool.poetry]
name = "transaction-analyzer"
version = "0.1.0"
description = "Анализатор банковских транзакций из Excel-файлов"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
pandas = "^2.0.0"
openpyxl = "^3.1.0"  # Для работы с Excel
requests = "^2.31.0"
python-dotenv = "^1.0.0"
loguru = "^0.7.0"  # Альтернатива стандартному logging

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
flake8 = "^6.0.0"
isort = "^5.12.0"
black = "^23.7.0"
mypy = "^1.5.0"
requests-mock = "^1.11.0"  # Для тестирования API

[tool.black]
line-length = 119
exclude = '''
/(
    \.git
    |\.venv
)/
'''

[tool.isort]
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = "venv"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
